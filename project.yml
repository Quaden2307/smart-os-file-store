name: SmartOSFileStore

options:
  bundleIdPrefix: com.quaden2307
  deploymentTarget:
    macOS: "27.0"
  developmentLanguage: en
  xcodeVersion: "27.2"
  createIntermediateGroups: true

# The only third-party dependency (CLAUDE.md). Only the engine links it; the app and the tests reach
# the database through the engine's own types. Pinned by commit, not by tag: the resolved-versions
# file lives in the generated project, which is not committed, and a tag can be moved. To update,
# take the commit of the new release's tag (`git ls-remote --tags <url>`) and change both lines.
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    revision: 92a554cd0d5e8d67cb18993c6054e73fe42c066c   # v7.12.0

# Applies to every target in every configuration.
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"   # Sign to Run Locally
    DEVELOPMENT_TEAM: ""
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Every built module lands in one products folder, so without this an `import` of a module the
    # target does not depend on can still compile. With it that import is a build error, which is
    # what keeps the chat module (no dependencies) away from the engine. Checked: docs/decisions/0020.
    DIAGNOSE_MISSING_TARGET_DEPENDENCIES: YES_ERROR

targets:
  SmartOSFileStore:
    type: application
    platform: macOS
    sources:
      - SmartOSFileStore
    dependencies:
      # Linked statically, not embedded: with Hardened Runtime on, an app signed to run locally
      # cannot load an embedded framework that carries no Team ID (library validation refuses it),
      # so the engine is linked into the app binary and there is nothing to validate.
      - target: FileStoreCore
        embed: false
      - target: FileStoreIntelligence
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quaden2307.SmartOSFileStore
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          # Sign to Run Locally injects get-task-allow (debugger attachment) into every build.
          # A build meant for users must not carry it; notarization rejects it.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    info:
      path: SmartOSFileStore/Info.plist
      properties:
        CFBundleDisplayName: Smart OS File Store
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSDownloadsFolderUsageDescription: Smart OS File Store lists and cleans up files in your Downloads folder only when you ask it to.

  FileStoreCore:
    type: framework
    platform: macOS
    sources:
      - FileStoreCore
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quaden2307.FileStoreCore
        GENERATE_INFOPLIST_FILE: YES   # a framework bundle needs an Info.plist to be signed
        SKIP_INSTALL: YES
        # A static framework: the same module and the same engine/app boundary, linked into the
        # app and the test bundle instead of being loaded at launch (see the app's dependency).
        MACH_O_TYPE: staticlib

  FileStoreCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - FileStoreCoreTests
    dependencies:
      - target: FileStoreCore
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quaden2307.FileStoreCoreTests
        GENERATE_INFOPLIST_FILE: YES

  # The Apple Intelligence chat. It has no dependencies on purpose: it cannot import the engine, so
  # it cannot reach the executor, the activity log or the database. The app hands it plain rows
  # (docs/decisions/0020). BoundaryTests fails if a dependency or an engine import ever appears.
  FileStoreIntelligence:
    type: framework
    platform: macOS
    sources:
      - FileStoreIntelligence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quaden2307.FileStoreIntelligence
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        MACH_O_TYPE: staticlib   # as FileStoreCore: linked into the app and the test bundle

  FileStoreIntelligenceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - FileStoreIntelligenceTests
    dependencies:
      - target: FileStoreIntelligence
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quaden2307.FileStoreIntelligenceTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SmartOSFileStore:
    build:
      targets:
        SmartOSFileStore: all
        FileStoreCore: all
        FileStoreIntelligence: all
        FileStoreCoreTests: [test]
        FileStoreIntelligenceTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # The default plan runs every test but the benchmark; the Benchmark plan runs only that
      # (README.md has the command).
      testPlans:
        - path: TestPlans/SmartOSFileStore.xctestplan
          defaultPlan: true
        - path: TestPlans/Benchmark.xctestplan
    archive:
      config: Release
